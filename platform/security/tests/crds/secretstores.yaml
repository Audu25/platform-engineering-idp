# The SecretStore kind from external-secrets chart 2.10.0, reduced to what the
# Kyverno CLI needs to map the kind to its resource. The schema is deliberately
# open: these tests check admission policy, not the operator's own validation.
# Never applied to a cluster.
# selectableFields are removed with the schema they refer to: a real API server
# rejects a CRD whose field selectors point at paths the schema does not declare.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretstores.external-secrets.io
spec:
  group: external-secrets.io
  names:
    categories:
    - external-secrets
    kind: SecretStore
    listKind: SecretStoreList
    plural: secretstores
    shortNames:
    - ss
    singular: secretstore
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
    served: true
    storage: true
