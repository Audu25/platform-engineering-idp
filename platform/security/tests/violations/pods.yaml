  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  serviceAccountName: sample-service
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/sample-service@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      securityContext:
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
---
# Reads the node's filesystem.
apiVersion: v1
kind: Pod
metadata:
  name: mounts-host-path
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  serviceAccountName: sample-service
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: node
      hostPath:
        path: /var/lib/kubelet
  containers:
    - name: api
      image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/sample-service@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      volumeMounts:
        - name: node
          mountPath: /node
          readOnly: true
---
