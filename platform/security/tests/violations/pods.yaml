---
# Same theft, through an environment variable instead of a volume.
apiVersion: v1
kind: Pod
metadata:
  name: env-from-neighbours-secret
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  serviceAccountName: sample-service
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/sample-service@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payments-config
              key: password
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
---
# A service named "pay" reaching "payments-config". A prefix check without the
# trailing hyphen would let this through; this fixture is why the hyphen exists.
apiVersion: v1
kind: Pod
metadata:
  name: name-prefix-collision
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: pay
spec:
  serviceAccountName: pay
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: config
      secret:
        secretName: payments-config
  containers:
    - name: api
      image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/pay@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
---
# The application container is hardened, but an init container is not. Init
# containers run with the pod's service account and volumes, so a privileged one
# is as dangerous as a privileged application container.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-init-container
  namespace: idp-production
  labels:
    app.kubernetes.io/name: sample-service
spec:
  serviceAccountName: sample-service
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: setup
      image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/sample-service@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      securityContext:
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
  containers:
    - name: api
      image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/sample-service@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
