# Pods that must be rejected. Each one is a compliant pod with exactly one thing
# wrong, named for that thing, so a failure points at the rule that caught it.
#
# These double as the runbook's demonstration: `kubectl apply -f` any of them in
# idp-dev and the API server returns the policy's message.
---
# Tag, not digest: the promoted, scanned bytes are not what would run.
apiVersion: v1
kind: Pod
metadata:
  name: image-by-tag
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  serviceAccountName: sample-service
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/sample-service:0123456789ab
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
---
# Pinned by digest, but from a registry CI never pushed to or scanned.
apiVersion: v1
kind: Pod
metadata:
  name: image-from-another-registry
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  serviceAccountName: sample-service
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: docker.io/library/nginx@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
---
# Root, with privilege escalation allowed.
apiVersion: v1
kind: Pod
metadata:
