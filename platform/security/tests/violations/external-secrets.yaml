# Secret wiring that must be rejected: each tries to reach another service's
# secrets through the External Secrets controller, which is allowed to assume
# every service's role and so will do whatever a store tells it to.
---
# A store for sample-service that names the payments role.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: store-with-neighbours-role
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      role: arn:aws:iam::111122223333:role/idp-dev-svc-payments
---
# Static access keys, which bypass the per-service role entirely.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: store-with-static-keys
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      role: arn:aws:iam::111122223333:role/idp-dev-svc-sample-service
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: sample-service-aws
            key: access-key-id
          secretAccessKeySecretRef:
            name: sample-service-aws
            key: secret-access-key
---
# sample-service's ExternalSecret using the payments store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uses-neighbours-store
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: payments
  target:
    name: sample-service-config
  dataFrom:
    - extract:
        key: idp-dev/sample-service/config
---
# Its own store, but a key under another service's prefix.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reads-neighbours-key
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: sample-service
  target:
    name: sample-service-config
  dataFrom:
    - extract:
        key: idp-dev/payments/config
---
# A search rather than a named key, which enumerates whatever the role can see.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searches-for-keys
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: sample-service
  target:
    name: sample-service-config
  dataFrom:
    - find:
        name:
          regexp: '.*'
---
# The right service, the wrong environment: a production store naming the dev
# role. Both roles belong to sample-service, so only the environment differs.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: store-from-another-environment
  namespace: idp-production
  labels:
    app.kubernetes.io/name: sample-service
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      role: arn:aws:iam::111122223333:role/idp-dev-svc-sample-service
---
# A production ExternalSecret reading dev's configuration for the same service.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reads-another-environments-key
  namespace: idp-production
  labels:
    app.kubernetes.io/name: sample-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: sample-service
  target:
    name: sample-service-config
  dataFrom:
    - extract:
        key: idp-dev/sample-service/config
