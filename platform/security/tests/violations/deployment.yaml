# The Deployment path must reject too, not only bare Pods. Argo CD applies
# Deployments; a policy that only caught Pods would let the Deployment through
# and fail later, per replica, as unexplained ReplicaSet errors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-image-by-tag
  namespace: idp-dev
  labels:
    app.kubernetes.io/name: sample-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-service
    spec:
      serviceAccountName: sample-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/sample-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
