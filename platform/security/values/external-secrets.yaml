# Values for external-secrets/external-secrets.
#
# The controller copies values from AWS Secrets Manager into Kubernetes Secrets.
# It holds no secret permission of its own: every SecretStore names a service's
# IAM role, and the controller assumes that role for that store only.

installCRDs: true

# Cluster-wide stores and cluster-wide ExternalSecrets are the two ways one
# service could read another's secrets without its role being involved. Their
# CRDs are not installed, so they cannot be created at all — not merely
# discouraged by policy. The chart requires processing to be off to match.
crds:
  createClusterSecretStore: false
  createClusterExternalSecret: false
  createClusterGenerator: false
  createClusterPushSecret: false
  createPushSecret: false
processClusterStore: false
processClusterExternalSecret: false
processClusterGenerator: false
processClusterPushSecret: false
# PushSecret writes from the cluster back into AWS. Nothing here needs that
# direction, and a compromised namespace should not be able to use it.
processPushSecret: false

# The Pod Identity association in infrastructure/terraform/environments/dev
# binds by this exact name. Changing it here without changing it there leaves
# the controller running with no AWS credentials.
serviceAccount:
  create: true
  name: external-secrets

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Off until the monitoring CRDs are guaranteed to exist first. Security installs
# before observability so that policy is in place before workloads arrive, which
# means a ServiceMonitor here would reference a kind the API does not know yet.
serviceMonitor:
  enabled: false
