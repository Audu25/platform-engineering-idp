# A service may only read its own Kubernetes Secrets.
#
# Every service shares the idp-dev namespace, and Kubernetes lets any pod mount
# any Secret in its namespace by name. IAM already stops one service's role
# reading another's values in AWS; without this, the copy External Secrets
# places in the cluster would be readable by every neighbour.
#
# The convention the chart follows is that a service's Secrets are prefixed with
# its name and a hyphen. The hyphen matters for the same reason the slash does in
# the IAM policy: without it, "pay" could mount "payments-config".
#
# Init containers are included here, unlike in pod security: an injected init
# container has no business reading application secrets either.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: idp-own-secrets-only
  annotations:
    policies.kyverno.io/title: Services mount only their own Secrets
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Secret volumes, projected secret sources and secret environment references
      must all name Secrets prefixed with the pod's app.kubernetes.io/name.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    # Every environment is governed identically. A rule staging does not enforce is
    # a rule a release can pass staging while breaking.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [idp-dev, idp-staging, idp-production]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  variables:
    - name: podSpec
      expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
    - name: podLabels
      expression: >-
        object.kind == 'Pod'
          ? (has(object.metadata.labels) ? object.metadata.labels : {})
          : (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels)
              ? object.spec.template.metadata.labels : {})
    - name: appName
      expression: >-
        'app.kubernetes.io/name' in variables.podLabels
          ? variables.podLabels['app.kubernetes.io/name'] : ''
    # An empty app name yields a prefix of "-", which no real Secret has, so a
    # pod without the label cannot mount any Secret at all.
    - name: prefix
      expression: "variables.appName + '-'"
    - name: allContainers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
  validations:
    - expression: >-
        !has(variables.podSpec.volumes) ||
        variables.podSpec.volumes.all(v,
          (!has(v.secret) ||
            (has(v.secret.secretName) && v.secret.secretName.startsWith(variables.prefix))) &&
          (!has(v.projected) || !has(v.projected.sources) ||
            v.projected.sources.all(s,
              !has(s.secret) || (has(s.secret.name) && s.secret.name.startsWith(variables.prefix)))))
      messageExpression: >-
        'Secret volumes in ' + variables.appName + ' pods must name Secrets beginning with "' +
        variables.prefix + '".'
    - expression: >-
        variables.allContainers.all(c,
          (!has(c.env) ||
            c.env.all(e,
              !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
              e.valueFrom.secretKeyRef.name.startsWith(variables.prefix))) &&
          (!has(c.envFrom) ||
            c.envFrom.all(f, !has(f.secretRef) || f.secretRef.name.startsWith(variables.prefix))))
      messageExpression: >-
        'Environment variables in ' + variables.appName + ' pods may only reference Secrets beginning with "' +
        variables.prefix + '".'
