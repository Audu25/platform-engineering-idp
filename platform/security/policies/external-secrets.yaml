# SecretStores and ExternalSecrets stay inside their own service.
#
# The External Secrets controller can assume any per-service role. What decides
# which role a given store uses is the store's own spec, written into the
# cluster. Without constraints, a service's chart could declare a store naming a
# neighbour's role, or an ExternalSecret pointing at a neighbour's store, and read
# that neighbour's secrets through a perfectly legitimate controller.
#
# IAM is the first boundary (the controller can only reach idp-*-svc-* roles,
# and a service role can only read its own prefix). This is the second: it makes
# the store-to-role and secret-to-store mapping follow the service's name.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: idp-external-secrets-scoped
  annotations:
    policies.kyverno.io/title: Secret stores and external secrets scoped to their service
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      A SecretStore must use AWS Secrets Manager through its own service's role and
      no static credentials. An ExternalSecret must use its own service's store,
      read only that service's keys, and produce a Secret prefixed with its name.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # Every environment is governed identically. A rule staging does not enforce is
    # a rule a release can pass staging while breaking.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [idp-dev, idp-staging, idp-production]
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secretstores, externalsecrets]
  variables:
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: appName
      expression: >-
        'app.kubernetes.io/name' in variables.labels
          ? variables.labels['app.kubernetes.io/name'] : ''
    - name: isStore
      expression: "object.kind == 'SecretStore'"
    - name: aws
      expression: >-
        has(object.spec.provider) && has(object.spec.provider.aws)
          ? object.spec.provider.aws : {}
    # Roles and secrets are named after the namespace, which is named after the
    # environment. Deriving both from it is what stops a production store from
    # borrowing the dev role, or a production secret from reading dev's keys.
    - name: namespace
      expression: "has(object.metadata.namespace) ? object.metadata.namespace : ''"
    - name: keyPrefix
      expression: "variables.namespace + '/' + variables.appName + '/'"
  validations:
    - expression: "variables.appName != ''"
      message: SecretStores and ExternalSecrets must carry the app.kubernetes.io/name label of the service they belong to.

    # --- SecretStore ---------------------------------------------------------
    - expression: >-
        !variables.isStore ||
        (has(object.spec.provider) && size(object.spec.provider) == 1 && has(object.spec.provider.aws) &&
         has(variables.aws.service) && variables.aws.service == 'SecretsManager')
      message: SecretStores must use AWS Secrets Manager and no other provider.
    - expression: >-
        !variables.isStore ||
        (has(variables.aws.role) &&
         variables.aws.role.endsWith(':role/' + variables.namespace + '-svc-' + variables.appName))
      messageExpression: >-
        'The SecretStore for ' + variables.appName + ' in ' + variables.namespace +
        ' must assume the role ' + variables.namespace + '-svc-' + variables.appName +
        ', not another service\'s or another environment\'s role.'
    # Static access keys would bypass the role entirely, and additional roles
    # would chain onward from it. Neither has a legitimate use here.
    - expression: >-
        !variables.isStore ||
        (!has(variables.aws.auth) && !has(variables.aws.additionalRoles))
      message: SecretStores must not use static credentials or chain into additional roles.

    # --- ExternalSecret ------------------------------------------------------
    - expression: >-
        variables.isStore ||
        (has(object.spec.secretStoreRef) &&
         (!has(object.spec.secretStoreRef.kind) || object.spec.secretStoreRef.kind == 'SecretStore') &&
         object.spec.secretStoreRef.name == variables.appName)
      messageExpression: >-
        'The ExternalSecret for ' + variables.appName + ' must use the SecretStore named ' +
        variables.appName + '.'
    - expression: >-
        variables.isStore ||
        (has(object.spec.target) && has(object.spec.target.name) &&
         object.spec.target.name.startsWith(variables.appName + '-'))
      messageExpression: >-
        'The ExternalSecret for ' + variables.appName + ' must name its target Secret, beginning with "' +
        variables.appName + '-".'
    # find and sourceRef can enumerate or redirect to other keys and generators.
    - expression: >-
        variables.isStore ||
        ((!has(object.spec.data) ||
          object.spec.data.all(d, d.remoteRef.key.startsWith(variables.keyPrefix))) &&
         (!has(object.spec.dataFrom) ||
          object.spec.dataFrom.all(f,
            !has(f.find) && !has(f.sourceRef) &&
            (!has(f.extract) || f.extract.key.startsWith(variables.keyPrefix)))))
      messageExpression: >-
        'The ExternalSecret for ' + variables.appName + ' may only read keys under ' +
        variables.keyPrefix + ', by explicit key rather than search.'
