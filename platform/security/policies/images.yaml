# Images come from this platform's registry, by digest.
#
# Phase 3 made promotion write digests, and CI scans the image before it is
# pushed. Both guarantees are only as strong as the path around them: a manifest
# applied by hand with nginx:latest would skip the scan, the registry and the
# review entirely. This makes the promoted path the only path.
#
# Injected init containers are out of scope here: the operator references its
# instrumentation image by tag from its own registry, and that image is chosen by
# the platform in the Instrumentation resource, not by a service's chart.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: idp-images-from-platform-registry
  annotations:
    policies.kyverno.io/title: Digest-pinned images from the platform registry
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every service container image must come from an idp-dev ECR repository and
      be referenced by sha256 digest, so what runs is exactly what CI scanned.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    # Every environment is governed identically. A rule staging does not enforce is
    # a rule a release can pass staging while breaking.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [idp-dev, idp-staging, idp-production]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  variables:
    - name: podSpec
      expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
  validations:
    - expression: >-
        variables.podSpec.containers.all(c,
          c.image.matches(r'^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/idp-dev/[a-z][a-z0-9-]*@sha256:[a-f0-9]{64}$'))
      message: >-
        Container images must come from an idp-dev ECR repository and be pinned by
        digest, e.g. 111122223333.dkr.ecr.eu-west-2.amazonaws.com/idp-dev/name@sha256:<64 hex>.
        Deploy by merging a promotion pull request rather than applying an image directly.
