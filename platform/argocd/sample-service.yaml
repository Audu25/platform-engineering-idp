apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-service-dev
  namespace: argocd
spec:
  project: idp
  source:
    repoURL: https://github.com/OWNER/platform-engineering-idp.git
    targetRevision: main
    path: platform/helm/sample-service
    helm:
      releaseName: sample
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: idp-dev
  # Manual sync in Phase 1; automated reconciliation is enabled in Phase 3.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
