# External Secrets: copies values from AWS Secrets Manager into Kubernetes
# Secrets, assuming each service's own IAM role to do it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-external-secrets
  namespace: argocd
  annotations:
    # Before services, whose charts create SecretStores and ExternalSecrets.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/security/values/external-secrets.yaml
    - repoURL: https://github.com/OWNER/platform-engineering-idp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  revisionHistoryLimit: 5
