# Prometheus, Alertmanager, Grafana and the exporters that make the cluster itself measurable.
#
# Chart version is pinned. An upstream chart that follows a range would let a
# release nobody reviewed change the cluster's monitoring the next time Argo CD
# reconciles, which is the moment monitoring is least likely to be watched.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-kube-prometheus-stack
  namespace: argocd
  annotations:
    # Charts install first; the configuration that depends on their custom
    # resources follows in wave 1.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 90.0.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/observability/values/kube-prometheus-stack.yaml
    # Values live in this repository so a change to how monitoring is configured
    # is reviewed here rather than typed into an Application spec.
    - repoURL: https://github.com/OWNER/platform-engineering-idp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # These charts ship large CRDs that exceed the annotation size limit a
      # client-side apply uses to store the previous configuration.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  revisionHistoryLimit: 5
