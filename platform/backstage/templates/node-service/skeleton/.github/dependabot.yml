# Pinned action SHAs and the base image do not update themselves. Dependabot is
# what keeps a pinned digest from quietly becoming an unpatched one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
