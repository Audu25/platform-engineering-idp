# ${{ values.description }}
#
# Created by the Node.js HTTP service template. Two sources, one Application: the
# shared chart supplies how the workload runs, deployment state supplies which
# image bytes run.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: idp
  sources:
    - repoURL: https://github.com/${{ values.githubOwner }}/platform-engineering-idp.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/${{ values.githubOwner }}/platform-engineering-idp.git
      targetRevision: main
      path: platform/helm/service
      helm:
        releaseName: ${{ values.name }}
        valueFiles:
          - values-dev.yaml
          - $values/gitops/environments/dev/${{ values.name }}.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: idp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
