apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample-service.name" . }}
  labels:
    {{- include "sample-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "sample-service.selectorLabels" . | nindent 4 }}
