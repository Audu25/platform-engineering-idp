{{- if .Values.secrets.enabled }}
{{- $name := include "service.name" . }}
{{- $aws := required "aws settings are required when secrets.enabled is true" .Values.aws }}
{{- $account := required "aws.accountId is required when secrets.enabled is true" $aws.accountId }}
{{- /*
An unquoted twelve-digit account ID is parsed by YAML as a number and printed in
scientific notation, which produces a role ARN that looks almost right and fails
at runtime with an access error. Refusing to render is the kinder failure.
*/}}
{{- if not (kindIs "string" $account) }}
{{- fail "aws.accountId must be a quoted string, e.g. accountId: \"111122223333\"" }}
{{- end }}
{{- $prefix := required "aws.resourcePrefix is required when secrets.enabled is true" $aws.resourcePrefix }}
# Where this service's secrets come from. One store per service, naming that
# service's IAM role: the External Secrets controller assumes it for this store
# only, so a read is authorised by the service's own permissions.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "aws.region is required when secrets.enabled is true" $aws.region | quote }}
      role: {{ printf "arn:aws:iam::%s:role/%s-svc-%s" $account $prefix $name | quote }}
---
# The Kubernetes Secret this service mounts. The value lives in Secrets Manager;
# this resource describes only which secret and how often to re-read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  # How long a rotation in Secrets Manager takes to reach the cluster, at most.
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $name }}
  target:
    name: {{ $name }}-config
    creationPolicy: Owner
    # If the source secret disappears, keep serving the last value rather than
    # deleting the Secret out from under running pods.
    deletionPolicy: Retain
  dataFrom:
    # Each JSON key in the secret becomes a file under secrets.mountPath.
    - extract:
        key: {{ printf "%s/%s/config" $prefix $name | quote }}
{{- end }}
