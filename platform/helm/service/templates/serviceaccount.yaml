{{- if .Values.serviceAccount.create }}
# Each service runs as its own identity. EKS Pod Identity binds this account's
# name to the service's IAM role, so AWS access follows the service rather than
# the node it happens to be scheduled on. It needs no annotation: the binding
# lives in Terraform, where it is reviewed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
# Services do not call the Kubernetes API, so they get no token for it. Pod
# Identity credentials arrive through their own projected volume, not this one.
automountServiceAccountToken: false
{{- end }}
